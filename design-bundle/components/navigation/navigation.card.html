<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font:var(--type-body)}.grp{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}.lbl{font:var(--type-label);letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);width:100%;margin-bottom:2px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { AppHeader, Tabs, TabBar, Avatar, IconButton } = window.TriluDesignSystem_9e1798;
const Ico=({n,s=20,c='currentColor'})=>{const r=React.useRef(null);React.useEffect(()=>{const d=window.lucide.icons[n];if(d&&r.current)r.current.innerHTML=window.lucide.createElement(d).outerHTML;},[n]);return <span ref={r} style={{display:'inline-flex',width:s,height:s,color:c}} data-s={s}/>;};

function Demo(){const[t,setT]=React.useState('semana'),[n,setN]=React.useState('trilha');return <div>
<div className="grp" style={{flexDirection:'column',alignItems:'stretch'}}><span className="lbl">AppHeader</span>
<div style={{background:'#fff',borderRadius:'var(--radius-lg)',overflow:'hidden',boxShadow:'var(--shadow-sm)'}}>
<AppHeader tone="brand" title="Olá, Paulo!" subtitle="Faltam 2 passos para o marco" right={<Avatar name="Paulo Reis" size="sm"/>}/>
<AppHeader title="Treino A • Peito" left={<IconButton label="Voltar" icon={<Ico n="ChevronLeft"/>}/>} right={<IconButton label="Mais" icon={<Ico n="MoreHorizontal"/>}/>}/>
</div></div>
<div className="grp"><span className="lbl">Tabs</span>
<Tabs value={t} onChange={setT} items={[{value:'semana',label:'Semana'},{value:'mes',label:'Mês'},{value:'tudo',label:'Tudo'}]}/>
</div>
<div className="grp" style={{flexDirection:'column',alignItems:'stretch'}}><span className="lbl">TabBar</span>
<div style={{borderRadius:'var(--radius-lg)',overflow:'hidden',boxShadow:'var(--shadow-sm)'}}>
<TabBar value={n} onChange={setN} items={[{value:'trilha',label:'Trilha',icon:<Ico n="Route" s={22}/>},{value:'treino',label:'Treino',icon:<Ico n="Dumbbell" s={22}/>},{value:'amigos',label:'Amigos',icon:<Ico n="Users" s={22}/>},{value:'perfil',label:'Perfil',icon:<Ico n="User" s={22}/>}]}/>
</div></div></div>;}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
