<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font:var(--type-body)}.grp{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}.lbl{font:var(--type-label);letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);width:100%;margin-bottom:2px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Card, Badge, Tag, Avatar } = window.TriluDesignSystem_9e1798;
const Ico=({n,s=20,c='currentColor'})=>{const r=React.useRef(null);React.useEffect(()=>{const d=window.lucide.icons[n];if(d&&r.current)r.current.innerHTML=window.lucide.createElement(d).outerHTML;},[n]);return <span ref={r} style={{display:'inline-flex',width:s,height:s,color:c}} data-s={s}/>;};

function Demo(){const[t,setT]=React.useState('peito');return <div>
<div className="grp"><span className="lbl">Button · variants</span>
<Button variant="primary">Continuar</Button>
<Button variant="accent">Começar treino</Button>
<Button variant="success">Concluir série</Button>
<Button variant="secondary">Depois</Button>
<Button variant="outline">Pular</Button>
<Button variant="ghost">Ver tudo</Button>
</div>
<div className="grp"><span className="lbl">Sizes · icon · loading · disabled</span>
<Button size="sm">Pequeno</Button><Button size="md">Médio</Button><Button size="lg" iconLeft={<Ico n="Play" s={18}/>}>Grande</Button>
<Button loading>Salvando</Button><Button disabled>Bloqueado</Button>
</div>
<div className="grp"><span className="lbl">IconButton</span>
<IconButton variant="ghost" label="Voltar" icon={<Ico n="ChevronLeft"/>}/>
<IconButton variant="soft" label="Filtrar" icon={<Ico n="SlidersHorizontal"/>}/>
<IconButton variant="card" label="Sino" icon={<Ico n="Bell"/>}/>
<IconButton variant="solid" label="Adicionar" icon={<Ico n="Plus"/>}/>
</div>
<div className="grp"><span className="lbl">Badge · Tag · Avatar</span>
<Badge tone="violet">Missão de hoje</Badge><Badge tone="coral">Próximo marco</Badge><Badge tone="mint">Concluído</Badge><Badge tone="sun">Novo recorde</Badge><Badge tone="solid">Pro</Badge>
<Tag selected={t==='peito'} onClick={()=>setT('peito')}>Peito</Tag>
<Tag selected={t==='costas'} onClick={()=>setT('costas')}>Costas</Tag>
<Avatar name="Paulo Reis" size="sm"/><Avatar name="Ana Lima" size="md" ring="var(--trilu-mint)"/>
</div>
<div className="grp" style={{alignItems:'stretch'}}><span className="lbl">Card tones</span>
<Card style={{flex:1}}><b>default</b></Card>
<Card tone="accent" style={{flex:1}}><b>accent</b></Card>
<Card tone="success" style={{flex:1}}><b>success</b></Card>
<Card tone="celebrate" style={{flex:1}}><b>celebrate</b></Card>
<Card tone="brand" style={{flex:1}}><b>brand</b></Card>
</div></div>;}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
