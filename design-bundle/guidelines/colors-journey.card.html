<!-- @dsCard group="Colors" viewport="700x150" name="Journey states" subtitle="Cores fixas dos nós da trilha" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font:var(--type-body);height:150px;box-sizing:border-box;overflow:hidden}.row{display:flex;gap:12px;align-items:center;height:100%}.sw{flex:1;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:100%;font-size:11px;font-weight:800;font-family:var(--font-body)}.nm{font:var(--type-label);letter-spacing:var(--tracking-wide);text-transform:uppercase}.hx{opacity:.72;font-weight:600;font-size:11px}</style></head><body><div class="row">
<div class="sw" style="background:var(--journey-done);color:#fff"><span class="nm">Percorrido</span><span class="hx">--journey-done</span></div>
<div class="sw" style="background:var(--journey-current);color:#fff"><span class="nm">Atual</span><span class="hx">--journey-current</span></div>
<div class="sw" style="background:var(--journey-goal);color:#5C400A"><span class="nm">Meta</span><span class="hx">--journey-goal</span></div>
<div class="sw" style="background:var(--journey-locked);color:#17213B"><span class="nm">Bloqueado</span><span class="hx">--journey-locked</span></div>
<div class="sw" style="background:var(--journey-track);color:#37456A"><span class="nm">Trilho</span><span class="hx">--journey-track</span></div>
</div></body></html>
