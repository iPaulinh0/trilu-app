<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font:var(--type-body);height:120px;box-sizing:border-box;overflow:hidden}.row{display:flex;gap:12px;align-items:center;height:100%}.sw{flex:1;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:100%;font-size:11px;font-weight:800;font-family:var(--font-body)}.nm{font:var(--type-label);letter-spacing:var(--tracking-wide);text-transform:uppercase}.hx{opacity:.72;font-weight:600;font-size:11px}</style></head><body><div class="row"><div class="sw" style="background:var(--coral-50);color:var(--ink-700);justify-content:flex-end"><span class="hx">50</span></div><div class="sw" style="background:var(--coral-100);color:var(--ink-700);justify-content:flex-end"><span class="hx">100</span></div><div class="sw" style="background:var(--coral-200);color:var(--ink-700);justify-content:flex-end"><span class="hx">200</span></div><div class="sw" style="background:var(--coral-300);color:var(--ink-700);justify-content:flex-end"><span class="hx">300</span></div><div class="sw" style="background:var(--coral-400);color:#fff;justify-content:flex-end"><span class="hx">400</span></div><div class="sw" style="background:var(--coral-500);color:#fff;justify-content:flex-end"><span class="hx">500</span></div><div class="sw" style="background:var(--coral-600);color:#fff;justify-content:flex-end"><span class="hx">600</span></div><div class="sw" style="background:var(--coral-700);color:#fff;justify-content:flex-end"><span class="hx">700</span></div><div class="sw" style="background:var(--coral-800);color:#fff;justify-content:flex-end"><span class="hx">800</span></div><div class="sw" style="background:var(--coral-900);color:#fff;justify-content:flex-end"><span class="hx">900</span></div></div></body></html>
